[workspace]
name = "geometric-core"
version = "0.1.0"
description = "Cold CPU architecture for the Geometric Determinism Engine"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.14"
max = ">=26.2.0,<27"
networkx = ">=3.3,<4"
sqlite = ">=3.45,<4"
pip = "*"

[tasks]
seed-ref = "python tests/phonological_seed_reference.py"
bench-refinery = "python tests/integration_bench.py"
seed-mojo = "mojo -I src/1_gateway tests/phonological_seed.mojo"
bench-mojo = "mojo -I src/1_gateway -I src/2_execution tests/integration_bench.mojo"
integrity = "mojo -I src/1_gateway tests/run_integrity.mojo"
store-write = "truncate -s 100G knowledge_store.bin && mojo -I src/1_gateway knowledge_store.mojo"
query = "mojo -I src/1_gateway query_engine.mojo"
bench-retrieval = "mojo -I src/1_gateway benchmark_retrieval.mojo"
collision = "mojo -I src/1_gateway benchmark_collision_mojo.mojo"
consistency = "mojo -I src/1_gateway consistency_check.mojo"
stress-v2 = "mojo -I src/1_gateway src/1_gateway/stress_test_v2.mojo"
test-smoke = { depends-on = ["seed-ref", "bench-refinery", "seed-mojo", "bench-mojo", "integrity", "store-write", "query", "collision", "stress-mmap", "stress-1m"] }
build-portable = "bash build_portable.sh"
stress-mmap = "truncate -s 100G stress_test_model.bin && mojo stress_test_mmap.mojo"
stress-1m = "truncate -s 100G stress_test_model.bin && mojo stress_test_1m.mojo"
