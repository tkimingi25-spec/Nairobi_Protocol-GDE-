name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi runtime
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
      - name: Install project dependencies (pixi)
        run: |
          pixi project channel add https://conda.modular.com/max || true
          pixi install || true
      - name: Run integrity tests (Mojo)
        run: |
          pixi run mojo -I src/1_gateway tests/run_integrity.mojo || true
      - name: Run structured-store smoke (Mojo)
        run: |
          pixi run mojo -I src/1_gateway tests/structured_store_smoke.mojo || true
