name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi runtime
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
      - name: Install project dependencies (pixi)
        run: |
          pixi project channel add https://conda.modular.com/max || true
          pixi install || true
      # Python gates are strict: a failure here must fail CI.
      - name: Python regression gates
        run: |
          python3 tests/test_addressing_regression.py
          python3 tests/test_extent_store.py
          python3 tests/phonological_seed_reference.py
      # Mojo steps are strict too. They were previously suffixed with
      # "|| true", which made CI green regardless of compile errors
      # (this hid the structured_store_smoke to_string breakage).
      - name: Run integrity tests (Mojo)
        run: |
          pixi run mojo -I src/1_gateway tests/run_integrity.mojo
      - name: Run structured-store smoke (Mojo)
        run: |
          pixi run mojo -I src/1_gateway tests/structured_store_smoke.mojo
